[package]
name = "rusty_fuugbemu"
version = "0.1.4"
edition = "2021"

[features]
serial_debug = []

[dependencies]
bytemuck = { version = "1.14.0", features = ["derive"] }
clap = { version = "4.4.6", features = ["derive"] }
egui = { version = "0.33.2", default-features = false, features = [
  "bytemuck",
  "default_fonts"
] }
egui_glium = "0.33.2"
egui-wgpu = "0.33.2"
egui-winit = "0.33.2"
env_logger = "0.10.0"
glium = "0.36.0"
image = "0.25.2"
winit = "0.30"
log = "0.4.20"
pollster = "1.0"
queues = "1.1.0"
rfd = "0.12.1"
wgpu = "27"
