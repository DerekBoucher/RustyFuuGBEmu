name: Unit Tests
on:
  pull_request:

jobs:
  unit_tests:
    name: Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt install libglib2.0-dev pkg-config libatk1.0-0 libatk1.0-dev libgtk-3-dev
      - name: Install latest stable rust toolchain
        uses: actions-rs/toolchain@v1
        with:
            toolchain: stable
            default: true
      - name: Run cargo test
        uses: actions-rs/cargo@v1
        with:
          command: test
